appId: co.scorpion.conduit
productName: Conduit
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.eslintrc,.prettierrc,.gitignore}'
  - '!frameio-api-main/**'
  - '!.phcode.json'
extraResources:
  - from: CHANGELOG.md
    to: CHANGELOG.md
asarUnpack:
  - resources/**
mac:
  target:
    - target: dmg
      arch:
        - universal
  category: public.app-category.utilities
  icon: build/icon.png
  identity: "MICHAEL ERIC WAX (UMCA2LMNU5)"
dmg:
  artifactName: Conduit-mac_${version}.dmg
  contents:
    - x: 130
      y: 220
      type: file
      path: CHANGELOG.md
    - x: 410
      y: 220
      type: link
      path: /Applications
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Conduit-win_${version}.exe
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
