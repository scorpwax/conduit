appId: co.scorpion.conduit
productName: Conduit
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.eslintrc,.prettierrc,.gitignore}'
  - '!frameio-api-main/**'
  - '!.phcode.json'
extraResources:
  - from: CHANGELOG.md
    to: CHANGELOG.md
asarUnpack:
  - resources/**
mac:
  target:
    - target: dmg
      arch:
        - universal
  # ssh2's optional native crypto accelerator has no prebuilt arm64 binary, so
  # the universal build ends up with an identical x86_64-only copy on both
  # sides. electron-builder's arch-merge safety check flags that as suspicious
  # unless told it's expected — ssh2 falls back to pure-JS crypto automatically
  # if this module can't load on a given architecture, so this is safe.
  x64ArchFiles: "Contents/Resources/app.asar.unpacked/node_modules/ssh2/lib/protocol/crypto/build/Release/sshcrypto.node"
  category: public.app-category.utilities
  icon: build/icon.png
  identity: "MICHAEL ERIC WAX (UMCA2LMNU5)"
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSDocumentsFolderUsageDescription: Conduit needs access to browse and transfer files in your Documents folder.
    NSDesktopFolderUsageDescription: Conduit needs access to browse and transfer files on your Desktop.
    NSDownloadsFolderUsageDescription: Conduit needs access to browse and transfer files in your Downloads folder.
    NSRemovableVolumesUsageDescription: Conduit needs access to browse and transfer files on external drives.
    NSNetworkVolumesUsageDescription: Conduit needs access to browse and transfer files on network volumes.
dmg:
  artifactName: Conduit-mac_${version}.dmg
  contents:
    # The app itself — customizing `contents` replaces electron-builder's
    # default layout entirely, so this entry (unspecified type/path = the
    # built app) must be explicit or the DMG ships with no app inside it.
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
    - x: 270
      y: 370
      type: file
      path: CHANGELOG.md
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Conduit-win_${version}.exe
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
