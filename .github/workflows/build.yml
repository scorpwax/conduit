name: Build

on:
  # Run automatically when you push to main.
  push:
    branches: [main]
    # Pushing a version tag (e.g. `v1.26.0`) additionally publishes a GitHub
    # Release with the built DMG/EXE attached — see the `release` job below.
    tags: ['v*']
  # Also lets you trigger a build manually from the Actions tab.
  workflow_dispatch:

jobs:
  build-mac:
    name: macOS (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # postinstall runs patch-wasabi-compat.js automatically via npm ci,
      # but call it explicitly here so it's visible in the log.
      - name: Patch Wasabi compat
        run: node scripts/patch-wasabi-compat.js

      - name: Build & package (macOS)
        run: npx electron-vite build && npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Conduit-mac
          path: dist/*.dmg
          if-no-files-found: error

  build-win:
    name: Windows (NSIS installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch Wasabi compat
        run: node scripts/patch-wasabi-compat.js

      - name: Build & package (Windows)
        run: npx electron-vite build && npx electron-builder --win --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Conduit-win
          path: dist/*.exe
          if-no-files-found: error

  # Only runs when the trigger was a version tag push (e.g. `git tag v1.26.0
  # && git push --tags`) — a plain push to main just builds and uploads the
  # artifacts above without publishing a release.
  release:
    name: Publish GitHub Release
    needs: [build-mac, build-win]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Conduit-mac/*.dmg
            artifacts/Conduit-win/*.exe
          generate_release_notes: true
