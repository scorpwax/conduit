name: Build

on:
  # Run automatically when you push to main.
  push:
    branches: [main]
    # Pushing a version tag (e.g. `v1.26.0`) additionally publishes a GitHub
    # Release with the built DMG/EXE attached — see the `release` job below.
    tags: ['v*']
  # Also lets you trigger a build manually from the Actions tab.
  workflow_dispatch:

jobs:
  build-mac:
    name: macOS (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # postinstall runs patch-wasabi-compat.js automatically via npm ci,
      # but call it explicitly here so it's visible in the log.
      - name: Patch Wasabi compat
        run: node scripts/patch-wasabi-compat.js

      # electron-builder auto-notarizes once it finds Apple API key credentials
      # in the environment — the key itself has to be a file on disk, so write
      # the secret's contents out first and point APPLE_API_KEY at that path.
      - name: Write notarization API key
        run: echo "${{ secrets.APPLE_API_KEY_CONTENT }}" > /tmp/apple_api_key.p8

      # Import the signing certificate into its own keychain ourselves, with a
      # password we control, instead of letting electron-builder create and
      # manage a temporary keychain from CSC_LINK/CSC_KEY_PASSWORD directly.
      # electron-builder's own keychain-creation path hits a recurring
      # `security set-key-partition-list` / SecKeychainUnlock failure on
      # current macos-latest runners, unrelated to whether the certificate
      # password itself is correct — this sidesteps it entirely.
      - name: Import Code-Signing Certificate
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "${{ secrets.CSC_LINK }}" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "${{ secrets.CSC_KEY_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security default-keychain -s "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"

      - name: Build & package (macOS)
        # No CSC_LINK/CSC_KEY_PASSWORD here — electron-builder auto-discovers
        # the identity already imported into the default keychain above.
        run: npx electron-vite build && npx electron-builder --mac --publish never
        env:
          APPLE_API_KEY: /tmp/apple_api_key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Conduit-mac
          path: dist/*.dmg
          if-no-files-found: error

  build-win:
    name: Windows (NSIS installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch Wasabi compat
        run: node scripts/patch-wasabi-compat.js

      - name: Build & package (Windows)
        run: npx electron-vite build && npx electron-builder --win --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Conduit-win
          path: dist/*.exe
          if-no-files-found: error

  # Only runs when the trigger was a version tag push (e.g. `git tag v1.26.0
  # && git push --tags`) — a plain push to main just builds and uploads the
  # artifacts above without publishing a release.
  release:
    name: Publish GitHub Release
    needs: [build-mac, build-win]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Conduit-mac/*.dmg
            artifacts/Conduit-win/*.exe
          generate_release_notes: true
